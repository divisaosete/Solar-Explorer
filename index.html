<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1c"><title>Solar Explorer — Abrir laboratório</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e1c;color:#e8edf7;font:16px/1.7 system-ui,sans-serif}main{max-width:620px;padding:32px}h1{letter-spacing:3px}a{color:#edc77c}code{background:#162238;padding:3px 7px;border-radius:4px}p{color:#b4c3d9}</style></head><body><main><small>NEW ERA LABS / DIVISÃO 7</small><h1>SOLAR EXPLORER</h1><p id="status" role="status">Abrindo o laboratório…</p><p><a href="./dist/index.html">Abrir a aplicação compilada</a></p><p>Na primeira execução, rode <code>npm ci</code> e <code>npm run build</code> no terminal desta pasta e atualize a página. Para desenvolver, use <code>npm run dev</code> e o endereço indicado pelo Vite.</p><noscript>Ative o JavaScript para explorar a aplicação.</noscript></main><script>fetch('./dist/index.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Build ausente');return r.text();}).then(function(html){if(!html.includes('./assets/'))throw new Error('Build incompatível');location.replace('./dist/index.html');}).catch(function(){document.getElementById('status').textContent='A versão compilada ainda não está disponível. Execute os comandos abaixo para gerar os arquivos.';});</script></body></html>
